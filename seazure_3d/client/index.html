<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seazure 3D</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script></head>
<body>
<div id="menu" class="screen active"><h1>SEAZURE</h1><p>5v5 • DRAW YOUR WAY TO VICTORY</p>
<button id="create">CREATE MATCH</button><button id="join">JOIN MATCH</button><button id="practice">PRACTICE</button></div>
<div id="lobby" class="screen"><h2>LOBBY <span id="code"></span></h2><div id="list"></div>
<div class="settings"><label>Rounds <input id="rounds" type="number" value="5" min="1" max="9"></label><label>Round Time <input id="roundTime" type="number" value="180" min="30"></label></div>
<button id="ready">READY</button><button id="start">START MATCH</button><button class="back">BACK</button></div>
<div id="class" class="screen"><h2>CHOOSE YOUR CLASS</h2><div id="classes"></div><button id="enter">ENTER ROUND</button></div>
<div id="hud"><div><b id="team">ATTACK</b> <span id="score">0 - 0</span></div><div id="timer">03:00</div><div>🖍 <span id="ammo">12</span></div></div>
<div id="cross">+</div><div id="notice"></div><div id="help">WASD • SHIFT SPRINT • CLICK CRAYON • R RELOAD • 1-6 CLASS</div>
<script type="module" src="game.js"></script></body></html>
